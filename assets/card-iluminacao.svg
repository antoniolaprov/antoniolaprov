<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-label="Iluminação inteligente">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f17"/><stop offset="1" stop-color="#0d1b2e"/></linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0"/><stop offset="0.5" stop-color="#5fd38d"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="580" height="250" rx="16"/></clipPath>
    <style>
      .rotulo { font: 600 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #5fd38d; letter-spacing: 1.5px; }
      .titulo { font: 700 26px "Segoe UI", Helvetica, Arial, sans-serif; fill: #f2f7f4; }
      .desc { font: 400 15px "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c8bf; }
      .tag { font: 500 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d7e6de; }
      .selo { font: 600 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #5fd38d; }
      .surge { opacity: 0; animation: surge 0.7s ease-out forwards; }
      @keyframes surge { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .varre { animation: varre 3.5s ease-in-out infinite; }
      @keyframes varre { from { transform: translateX(-580px); } to { transform: translateX(580px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="580" height="250" fill="url(#fundo)"/>
    <rect width="580" height="250" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect class="varre" y="0" width="580" height="3" fill="url(#brilho)"/>
    <text x="28" y="44" class="rotulo surge">SISTEMAS EMBARCADOS</text>
    <text x="28" y="78" class="titulo surge" style="animation-delay:0.1s">Iluminação inteligente</text>
    
    <text x="28" y="108" class="desc surge" style="animation-delay:0.25s">Poste conectado que ajusta a potência pela presença</text><text x="28" y="132" class="desc surge" style="animation-delay:0.31s">de pessoas na rua e avisa a central quando a</text><text x="28" y="156" class="desc surge" style="animation-delay:0.37s">lâmpada falha.</text>
    <g class="surge" style="animation-delay:0.50s"><rect x="28" y="198" width="62" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#5fd38d" stroke-opacity="0.35"/><text x="59.0" y="215.5" text-anchor="middle" class="tag">ESP32</text></g><g class="surge" style="animation-delay:0.58s"><rect x="98" y="198" width="54" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#5fd38d" stroke-opacity="0.35"/><text x="125.0" y="215.5" text-anchor="middle" class="tag">MQTT</text></g><g class="surge" style="animation-delay:0.66s"><rect x="160" y="198" width="78" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#5fd38d" stroke-opacity="0.35"/><text x="199.0" y="215.5" text-anchor="middle" class="tag">Arduino</text></g>
  </g>
</svg>
